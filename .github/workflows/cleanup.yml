name: One-off cleanup (old releases, tags, run logs)

# Removes builds that were made before the repo went public (they carry old
# metadata), their tags, and old workflow run logs. Safe to delete this file after.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete old releases and their tags
        run: |
          for t in $(gh release list -R "$REPO" --limit 100 --json tagName --jq '.[].tagName'); do
            echo "deleting release $t"; gh release delete "$t" -R "$REPO" --yes --cleanup-tag
          done
          for t in $(gh api "repos/$REPO/git/matching-refs/tags" --jq '.[].ref' | sed 's#refs/tags/##'); do
            echo "deleting tag $t"; gh api -X DELETE "repos/$REPO/git/refs/tags/$t" || true
          done
      - name: Delete old workflow run logs (keep this run)
        run: |
          for id in $(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[].id'); do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && echo "deleted run $id" || echo "skip $id"
          done
      - name: Summary
        run: |
          echo "::notice title=cleanup::releases=$(gh release list -R "$REPO" --json tagName --jq length) tags=$(gh api "repos/$REPO/git/matching-refs/tags" --jq length)"
