name: Build Byte Monitor

# Builds the Windows .exe (installer + portable) and Linux AppImage/.deb,
# then attaches them to a GitHub Release named after package.json's version.
# (Releases don't count against the Actions artifact storage quota.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
            files: dist/*.exe
          - os: ubuntu-latest
            cmd: npm run dist:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Bundle smartctl (smartmontools, GPL-2.0) so full NVMe/SATA SMART works out of the box on Windows
      - name: Fetch smartctl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install smartmontools -y --no-progress | Out-Null
          $src = 'C:\Program Files\smartmontools'
          New-Item -ItemType Directory -Force build\smartctl | Out-Null
          Copy-Item "$src\bin\smartctl.exe" build\smartctl\
          Get-ChildItem "$src" -Recurse -Include COPYING*,LICENSE* | Select-Object -First 1 | Copy-Item -Destination build\smartctl\COPYING.txt
          $ver = (& build\smartctl\smartctl.exe --version | Select-Object -First 1)
          @("smartctl from smartmontools, licensed GPL-2.0 (see COPYING.txt).", "Version: $ver", "Unmodified binary. Source: https://github.com/smartmontools/smartmontools (tag matching the version above) and https://www.smartmontools.org", "Byte Monitor runs smartctl as a separate program; it is not linked into Byte Monitor.") | Set-Content build\smartctl\NOTICE.txt
          & build\smartctl\smartctl.exe --version | Select-Object -First 1
      # Sensor helper: LibreHardwareMonitorLib + PawnIO → real CPU temps, fans, motherboard sensors
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: 8.0.x
      - name: Build sensor helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet publish sensors-helper/ByteSensors.csproj -c Release -o build/sensors
          if ($LASTEXITCODE -ne 0) { throw 'helper build failed' }
          Copy-Item sensors-helper/THIRD-PARTY-NOTICES.txt, sensors-helper/LICENSE-LibreHardwareMonitorLib-MPL-2.0.txt build/sensors/
          Get-ChildItem build/sensors -Exclude *.exe,*.txt | Remove-Item -Recurse -Force
          gh release download --repo namazso/PawnIO.Setup --pattern '*.exe' --dir build/pawnio --clobber
          $setup = Get-ChildItem build/pawnio -Filter *.exe | Select-Object -First 1
          if (-not $setup) { throw 'PawnIO setup not found in latest release' }
          Copy-Item $setup.FullName build/sensors/PawnIO_setup.exe
          "PawnIO setup: $($setup.Name) $([math]::Round($setup.Length/1KB)) KB"
          Get-ChildItem build/sensors | Format-Table Name, Length
      - name: Smoke-test sensor helper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = & build/sensors/byte-sensors.exe --once 2>&1 | Out-String
          $json = ($out -split '@@END@@')[0].Trim()
          $o = $json | ConvertFrom-Json
          $types = ($o.lhm | Group-Object SensorType | ForEach-Object { "$($_.Name)=$($_.Count)" }) -join ', '
          $msg = "helper OK: $($o.hw.Count) devices, $($o.lhm.Count) sensors ($types); PawnIO installed: $($o.pawnio)"
          "::notice title=sensor helper::$msg"
          if ($o.hw.Count -lt 1) { throw 'helper returned no hardware' }
      - run: ${{ matrix.cmd }}
      - name: Check smartctl is bundled (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path dist\win-unpacked\resources\smartctl\smartctl.exe)) { throw 'smartctl.exe missing from build' }
          if (-not (Test-Path dist\win-unpacked\resources\sensors\byte-sensors.exe)) { throw 'byte-sensors.exe missing from build' }
          if (-not (Test-Path dist\win-unpacked\resources\sensors\PawnIO_setup.exe)) { throw 'PawnIO_setup.exe missing from build' }
          & dist\win-unpacked\resources\smartctl\smartctl.exe --version | Select-Object -First 1
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Byte Monitor ${{ steps.ver.outputs.v }}
          prerelease: true
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
