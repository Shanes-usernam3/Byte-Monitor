name: Build Byte Monitor

# Builds the Windows .exe (installer + portable) and Linux AppImage/.deb,
# then attaches them to a GitHub Release named after package.json's version.
# (Releases don't count against the Actions artifact storage quota.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            cmd: npm run dist:win
          - os: ubuntu-latest
            cmd: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.cmd }}
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.v }}
          name: Byte Monitor ${{ steps.ver.outputs.v }}
          prerelease: true
          files: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: true
